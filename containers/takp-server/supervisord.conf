; Process supervisor for the TAKP server binaries.
; shared_memory is run once by setup.sh before supervisord starts.

; supervisord itself runs as root (it needs to write to the container's
; stdout); every program below drops to the eqemu user.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

; Lets you run `supervisorctl status`, `supervisorctl restart world`, etc.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:world]
command=/home/eqemu/server/world
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=10
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queryserv]
command=/home/eqemu/server/queryserv
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=20
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ucs]
command=/home/eqemu/server/ucs
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=20
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; One section per launcher name in the `launcher` table.
; stopasgroup/killasgroup make sure the zone processes eqlaunch spawns
; also get the shutdown signal, so characters are saved.
[program:launcher-boats]
command=/home/eqemu/server/eqlaunch boats
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=30
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:launcher-zone1]
command=/home/eqemu/server/eqlaunch zone1
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=30
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:launcher-zone2]
command=/home/eqemu/server/eqlaunch zone2
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=30
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:launcher-zone3]
command=/home/eqemu/server/eqlaunch zone3
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=30
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Started last so players can't log in before zones are coming up.
[program:loginserver]
command=/bin/bash -c "sleep 20 && exec /home/eqemu/server/loginserver"
directory=/home/eqemu/server
user=eqemu
environment=HOME="/home/eqemu",USER="eqemu"
priority=40
autorestart=true
startsecs=25
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[group:zones]
programs=launcher-boats,launcher-zone1,launcher-zone2,launcher-zone3
