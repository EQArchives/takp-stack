networks:
  backend:
    driver: ${NETWORKS_DRIVER}

volumes:
  build:
  build-cache:
  mariadb-var-log:
  players-uploads:
  takp-var-log:

services:

  takp-server:
    hostname: ${CONTAINER_HOSTNAME:-takp-server}
    restart: unless-stopped
    build:
      context: ./containers/takp-server
      args:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
    volumes:
      - ./server:/home/eqemu/server:delegated
      - ./source:/home/eqemu/source:delegated
      - build:/home/eqemu/build
      - build-cache:/home/eqemu/.ccache/
      - takp-var-log:/var/log/
    ports:
      # Player ports
      - ${IP_ADDRESS}:6000:6000/udp
      - ${IP_ADDRESS}:9000:9000/udp
      - ${IP_ADDRESS}:7778:7778/udp
      - ${IP_ADDRESS}:${PORT_RANGE_LOW:-7000}-${PORT_RANGE_HIGH:-7030}:${PORT_RANGE_LOW:-7000}-${PORT_RANGE_HIGH:-7030}/udp
      # Developer/admin ports: localhost-only unless overridden in .env
      - ${SSH_BIND:-127.0.0.1}:2222:22
      - ${LOGIN_TCP_BIND:-127.0.0.1}:5998:5998
      - ${TELNET_BIND:-127.0.0.1}:9000:9000
      - ${WORLD_TCP_BIND:-127.0.0.1}:9001:9001
    environment:
      - AUTO_PULL=${AUTO_PULL:-false}
      - CC=${CC:-/usr/bin/gcc}
      - CCACHE_DIR=/home/eqemu/.ccache
      - CCACHE_MAXSIZE=${CCACHE_MAXSIZE:-5G}
      - CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE:-RelWithDebInfo}
      - CMAKE_EXTRA_ARGS=${CMAKE_EXTRA_ARGS:-}
      - CXX=${CXX:-/usr/bin/g++}
      - FORCE_RECOMPILE=${FORCE_RECOMPILE:-false}
      - IP_ADDRESS=${IP_ADDRESS:-127.0.0.1}
      - MAPS_BRANCH=${MAPS_BRANCH:-}
      - MAPS_REPO=${MAPS_REPO:-https://github.com/EQMacEmu/Maps.git}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_USER=${MARIADB_USER}
      - PORT_RANGE_HIGH=${PORT_RANGE_HIGH:-7030}
      - PORT_RANGE_LOW=${PORT_RANGE_LOW:-7000}
      - QUESTS_BRANCH=${QUESTS_BRANCH:-}
      - QUESTS_REPO=${QUESTS_REPO:-https://github.com/EQMacEmu/quests.git}
      - SERVER_LOCAL_ADDRESS=${SERVER_LOCAL_ADDRESS:-127.0.0.1}
      - SERVER_LONG_NAME=${SERVER_LONG_NAME:-My TAKP Server}
      - SERVER_PUBLIC_ADDRESS=${SERVER_PUBLIC_ADDRESS:-}
      - SERVER_SHORT_NAME=${SERVER_SHORT_NAME:-mytakp}
      - SOURCE_BRANCH=${SOURCE_BRANCH:-}
      - SOURCE_REPO=${SOURCE_REPO:-https://github.com/EQMacEmu/Server.git}
      - SSH_AUTHORIZED_KEYS=${SSH_AUTHORIZED_KEYS}
      - TELNET_ENABLED=${TELNET_ENABLED:-false}
      - TZ=${TZ:-UTC}
    tty: true
    stop_grace_period: 60s
    networks:
      - backend
    cap_add:
      # Needed for running perf traces
      # - CAP_SYS_ADMIN
      # For GDB traces but it has security implications
      - SYS_PTRACE
    depends_on:
      - fail2ban-server
      - mariadb

  mariadb:
    restart: unless-stopped
    build:
      context: ./containers/mariadb
      args:
        - INNODB_BUFFER_POOL_SIZE=${INNODB_BUFFER_POOL_SIZE:-256MB}
        - MARIADB_PORT=${MARIADB_PORT:-3306}
    ports:
      - ${MARIADB_BIND:-127.0.0.1}:${MARIADB_EXTERNAL_PORT:-3307}:${MARIADB_PORT:-3306}
    volumes:
      - ${DATA_PATH_HOST}/mariadb:/var/lib/mysql:delegated
      - mariadb-var-log:/var/log/mysql/
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
      - MYSQL_ALLOW_EMPTY_PASSWORD=NO
      - TZ=${TZ:-UTC}
    networks:
      - backend
    depends_on:
      - fail2ban-mariadb

  players:
    profiles: [players]
    restart: unless-stopped
    build:
      context: ${PLAYERS_REPO:-https://github.com/nazwadi/EQMacEmu_Players.git}#${PLAYERS_BRANCH:-main}
    volumes:
      - players-uploads:/app/uploads
    ports:
      - ${PLAYERS_BIND:-127.0.0.1}:${PLAYERS_PORT:-8000}:8000
    environment:
      - ALLOWED_HOSTS=${PLAYERS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${PLAYERS_CSRF_TRUSTED_ORIGINS:-}
      - DEBUG=${PLAYERS_DEBUG:-FALSE}
      - DJANGO_APP_DB_HOST=mariadb
      - DJANGO_APP_DB_NAME=${PLAYERS_DB_NAME:-players}
      - DJANGO_APP_DB_PASSWORD=${PLAYERS_DB_PASSWORD:-}
      - DJANGO_APP_DB_PORT=${MARIADB_PORT:-3306}
      - DJANGO_APP_DB_USER=${PLAYERS_DB_USER:-players}
      - DJANGO_APP_SECRET_KEY=${PLAYERS_SECRET_KEY:-}
      - GAME_DB_HOST=mariadb
      - GAME_DB_NAME=${MARIADB_DATABASE}
      - GAME_DB_PASSWORD=${PLAYERS_DB_PASSWORD:-}
      - GAME_DB_PORT=${MARIADB_PORT:-3306}
      - GAME_DB_USER=${PLAYERS_DB_USER:-players}
      - LS_DB_HOST=mariadb
      - LS_DB_NAME=${MARIADB_DATABASE}
      - LS_DB_PASSWORD=${PLAYERS_DB_PASSWORD:-}
      - LS_DB_PORT=${MARIADB_PORT:-3306}
      - LS_DB_USER=${PLAYERS_DB_USER:-players}
      - LS_PASSWORD_SALT=${PLAYERS_LS_PASSWORD_SALT:-}
      - REDIS_URL=redis://redis:6379/1
      - SITE_URL=${PLAYERS_SITE_URL:-http://localhost:8000}
      - TZ=${TZ:-UTC}
    networks:
      - backend
    depends_on:
      mariadb:
        condition: service_started
      players-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  players-db-init:
    profiles: [players]
    build:
      context: ./containers/mariadb
    restart: "no"
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./containers/players-db-init/init.sh:/init.sh:ro
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - PLAYERS_DB_NAME=${PLAYERS_DB_NAME:-players}
      - PLAYERS_DB_PASSWORD=${PLAYERS_DB_PASSWORD:-}
      - PLAYERS_DB_USER=${PLAYERS_DB_USER:-players}
      - PLAYERS_SECRET_KEY=${PLAYERS_SECRET_KEY:-}
    networks:
      - backend
    depends_on:
      - mariadb

  redis:
    profiles: [players]
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - backend

  fail2ban-server:
    restart: unless-stopped
    build:
      context: containers/fail2ban-server
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=30d
      - F2B_ACTION=%(action_)s
      - F2B_IPTABLES_CHAIN=DOCKER-USER
      - TZ=${TZ:-UTC}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - takp-var-log:/eqemu/var/log

  fail2ban-mariadb:
    restart: unless-stopped
    build:
      context: ./containers/fail2ban-mariadb
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=30d
      - F2B_ACTION=%(action_)s
      - F2B_IPTABLES_CHAIN=DOCKER-USER
      - TZ=${TZ:-UTC}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/log:/var/log:ro
      - mariadb-var-log:/mariadb/var/log/mysql/
